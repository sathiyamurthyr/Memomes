version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memomes-postgres
    restart: always
    environment:
      POSTGRES_DB: memomes
      POSTGRES_USER: memomes_user
      POSTGRES_PASSWORD: memomes_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memomes_user -d memomes"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: memomes-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: memomes-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Memomes.Api/Dockerfile
    container_name: memomes-api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=memomes;Username=memomes_user;Password=memomes_secure_password_123
      # --- Backblaze B2 Storage (S3-Compatible) ---
      - AWS__ServiceURL=https://s3.us-west-004.backblazeb2.com
      - AWS__AccessKeyId=008e0d1d842b
      - AWS__SecretAccessKey=0030f1320724707dc33f380426ddf3371c3fedb37a
      - AWS__BucketName=sathus-memomes-vault
      - AWS__Region=us-west-004
      - JWT__SecretKey=MemomesZeroKnowledgeSuperSecretKey2026SecureVault!
    depends_on:
      db:
        condition: service_healthy

  storage-api:
    build:
      context: .
      dockerfile: src/Memomes.Storage/Dockerfile
    container_name: memomes-storage-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # --- Backblaze B2 Storage (S3-Compatible via MinIO client) ---
      - MINIO_ENDPOINT=s3.us-west-004.backblazeb2.com
      - MINIO_ACCESS_KEY=008e0d1d842b
      - MINIO_SECRET_KEY=0030f1320724707dc33f380426ddf3371c3fedb37a
      - MINIO_BUCKET=sathus-memomes-vault
      - MINIO_SECURE=True
      - DATABASE_URL=postgresql+asyncpg://memomes_user:memomes_secure_password_123@db:5432/memomes
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=MemomesZeroKnowledgeSuperSecretKey2026SecureVault!
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
